server {
    listen 80;
    listen [::]:80;
    server_name brunch.oakschapel.org ://brunch.oakschapel.org;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name brunch.oakschapel.org ://brunch.oakschapel.org;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/://brunch.oakschapel.org;
    ssl_certificate_key /etc/letsencrypt/live/://brunch.oakschapel.org;

    # Optional optimized SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # Your website root or proxy_pass configuration goes here
        root /usr/share/nginx/html;
        index index.html;
    }
}
