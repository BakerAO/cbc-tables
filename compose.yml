services:
  nginx-proxy:
  container_name: nginx-proxy
  image: nginxproxy/nginx-proxy:alpine
  restart: unless-stopped
  labels:
    com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy: "true"
  volumes:
    - ./uploadsize.conf:/etc/nginx/conf.d/uploadsize.conf
    - /var/run/docker.sock:/tmp/docker.sock:z,ro
    - certs:/etc/nginx/certs:z,ro
    - vhost.d:/etc/nginx/vhost.d:z
    - html:/usr/share/nginx/html:z
  ports:
    - 80:80
    - 443:443
  networks:
    proxy-tier:
      ipv4_address: 172.20.20.2

  lets-encrypt:
    container_name: lets-encrypt
    image: nginxproxy/acme-companion
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:z,ro
      - certs:/etc/nginx/certs:z
      - acme:/etc/acme.sh:z
      - vhost.d:/etc/nginx/vhost.d:z
      - html:/usr/share/nginx/html:z
    networks:
      proxy-tier:
        ipv4_address: 172.20.20.3
    depends_on:
      - nginx-proxy

  client:
    container_name: cbc-client
    restart: unless-stopped
    build: ./client/
    ports:
      - "80:8000"
    environment:
      - VIRTUAL_HOST=${OCBC_DOMAIN}
      - LETSENCRYPT_HOST=${OCBC_DOMAIN}
    networks:
      proxy-tier:
        ipv4_address: 172.20.20.100

  api:
    container_name: cbc-api
    restart: unless-stopped
    build: ./api/
    ports:
      - "8001:8001"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PORT: 8002
      MYSQL_HOST: ${MYSQL_HOST}
      VIRTUAL_HOST: ${OCBC_DOMAIN}
      LETSENCRYPT_HOST: ${OCBC_DOMAIN}
    networks:
      proxy-tier:
        ipv4_address: 172.20.20.101

  db:
    image: mariadb
    container_name: cbc-mariadb
    restart: unless-stopped
    ports:
      - "8002:3306"
    volumes:
      - cbc-mariadb-volume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      proxy-tier:
        ipv4_address: 172.20.20.102

volumes:
  cbc-mariadb-volume:
  acme:
  certs:
  html:
  vhost.d:

networks:
  proxy-tier:
    ipam:
      config:
        - subnet: 172.20.20.0/24
          gateway: 172.20.20.1
