services:
  nginx-proxy:
    container_name: nginx-proxy
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/www/certbot:ro
    ports:
      - 80:80
      - 443:443
    networks:
      proxy-tier:
        ipv4_address: 172.20.20.2

  lets-encrypt:
    container_name: lets-encrypt
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt:rw
      - certbot-var:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      proxy-tier:
        ipv4_address: 172.20.20.3
    depends_on:
      - nginx-proxy

  client:
    container_name: cbc-client
    restart: unless-stopped
    build: ./client/
    ports:
      - "8000:8000"
    networks:
      proxy-tier:
        ipv4_address: 172.20.20.100

  api:
    container_name: cbc-api
    restart: unless-stopped
    build: ./api/
    ports:
      - "8001:8001"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PORT: 8002
      MYSQL_HOST: ${MYSQL_HOST}
    networks:
      proxy-tier:
        ipv4_address: 172.20.20.101

  db:
    image: mariadb
    container_name: cbc-mariadb
    restart: unless-stopped
    ports:
      - "8002:3306"
    volumes:
      - cbc-mariadb-volume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      proxy-tier:
        ipv4_address: 172.20.20.102

volumes:
  cbc-mariadb-volume:
  certbot-etc:
  certbot-var:

networks:
  proxy-tier:
    ipam:
      config:
        - subnet: 172.20.20.0/24
          gateway: 172.20.20.1
